<body><header class="topbar-inner" style="max-width:1040px">
  <a class="brand" href="../index.html"><span class="brand-mark">T</span><span class="brand-name">Tescomint</span></a>
  <button class="icon-btn" type="button" aria-label="Toggle dark mode" onclick="toggleTheme()">◐</button>
</header>
<main class="auth-wrap">
  <section class="hide-mobile">
    <p class="eyebrow accent">Secure investor access</p>
    <h2 style="font-size:34px;margin-top:12px">Digital asset investing, done seriously.</h2>
    <p class="muted" style="max-width:420px">Track deposits, run investment plans, monitor profits and manage payouts from one clean dashboard.</p>
  </section>
  <section class="auth-card">
    <h1 style="font-size:24px">Create your account</h1>
    <p class="muted">It takes under two minutes to get started.</p>
    <div class="mt"><form data-demo data-redirect="../user/index.html">
    <div class="grid g2-md"><label class="field"><span>Full name</span><input type="text" placeholder="Adaeze Okonkwo" /></label><label class="field"><span>Username</span><input type="text" placeholder="adaeze" /></label></div>
    <label class="field"><span>Email address</span><input type="email" placeholder="you@example.com" /></label>
    <label class="field"><span>Phone</span><input type="text" placeholder="+234 802 118 4420" /></label>
    <div class="grid g2-md"><label class="field"><span>Password</span><input type="password" placeholder="••••••••" /></label><label class="field"><span>Confirm password</span><input type="password" placeholder="••••••••" /></label></div>
    <label class="field"><span>Referral code (optional)</span><input type="text" placeholder="TESCO-XXXX" /></label>
    <label class="row small" style="gap:6px;margin-bottom:14px"><input type="checkbox" /> I agree to the terms of service and privacy policy.</label>
    <button class="btn block" type="submit">Create account</button>
  </form></div>
    <p class="muted mt">Already registered? <a href="login.html" style="color:var(--primary);font-weight:700">Sign in</a></p>
  </section>
